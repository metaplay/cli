name: Build CLI

# 'pull_request' also gates PRs from forks: a fork's push lands on the fork, so a
# bare 'push' trigger never runs them here. 'push' is narrowed to the long-lived
# branches so PR branches don't build twice; for a branch with no PR yet, use
# workflow_dispatch.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

run-name: Build from ${{ github.head_ref || github.ref_name }}

# Read-only: tests run dependency init() code, which must not get a write token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubicloud-standard-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          show-progress: false # suppress the noisy progress status output
          persist-credentials: false # keep the token out of .git/config

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true # newest patch of that line, not an older one cached on the runner

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .tool-versions

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: go mod tidy caused changes. Please run 'go mod tidy' locally and commit the changes."
            git status
            git diff
            exit 1
          fi

      - name: Build CLI
        run: go build .

      - name: Run unit tests
        run: go test ./...

  # The self-update path is Windows-specific: the binary swap, the ACL probe in
  # internal/version/update_windows.go and the path handling in internal/pathutil/windows.go are
  # all guarded by //go:build windows, so the Linux job above never compiles them.
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          show-progress: false # suppress the noisy progress status output
          persist-credentials: false # keep the token out of .git/config

      # setup-go's own cache is off because it saves from every ref. A pull request that changes
      # go.mod would save a ~700 MB entry that only that pull request can read. The steps below
      # restore on every ref and save only from main, so pull requests reuse main's entry instead.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true # newest patch of that line, not an older one cached on the runner
          cache: false

      - name: Locate Go caches
        id: go-cache-paths
        run: |
          "gomodcache=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
          "gocache=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT

      # Keyed on the installed Go version and on both go.mod and go.sum, which decide what the
      # caches hold. No restore-keys: an older entry would be restored and then saved again under
      # the new key, carrying modules the project no longer uses. publish-release.yaml restores
      # this entry with a copy of this key and path list, so change both files together.
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.gomodcache }}
            ${{ steps.go-cache-paths.outputs.gocache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run unit tests
        run: go test ./...

      # Report the self-update tests individually. Several of them need an ACL the runner may not
      # be able to express, in which case they skip — and a skip is invisible without -v, so this
      # job would look like it covered them when it did not.
      - name: Report self-update test results
        run: go test ./internal/version/ ./internal/pathutil/ ./cmd/ -count=1 -v -run 'Replaceable|Leftover|ForDisplay|UpdateTempPaths|ReplaceFailure|NotWritableDetails'

      # Saved after the tests so the build cache also holds the compiled test packages. It holds
      # the test results too, so later runs report unchanged packages as "(cached)".
      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.gomodcache }}
            ${{ steps.go-cache-paths.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
