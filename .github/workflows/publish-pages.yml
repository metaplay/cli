name: Publish Pages

on:
  push:
    # Only main may publish: customer CI pipelines run install.sh with deploy credentials.
    branches:
      - main
      # To iterate on this workflow, uncomment the dev branch below on that branch only, and
      # temporarily allow it in the 'github-pages' environment's branch policy. Never merge this
      # enabled into main or leave the branch allowed in the policy: any push to the branch would
      # replace the public install scripts.
      # - dev/pages-ci
    # Run on changes to the install scripts and this workflow. Keeps the public URLs up-to-date.
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/publish-pages.yml

permissions:
  contents: read     # to checkout your code
  pages: write       # to publish the Pages site
  id-token: write    # required by actions/deploy-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Naming the environment applies its protection rules (deploys from main only).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Copy the install.sh to be available publicly at https://metaplay.github.io/cli/install.sh.
      # GitHub Pages isn't throttled like the https://raw.githubusercontent.com/metaplay/cli/main/install.sh.
      - name: Prepare Pages output
        run: |
          # Copy install.sh and install.ps1 into 'site/'
          mkdir site
          cp install.sh site/
          cp install.ps1 site/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Show published URL
        run: echo "🎉 Site published at ${{ steps.deployment.outputs.page_url }}"
